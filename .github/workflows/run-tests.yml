name: run-tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4']
        bacon: ['^2.0', '^3.0']
        stability: [prefer-stable]
        include:
          - os: ubuntu-latest
            php: '8.2'
            bacon: '^2.0'
            stability: prefer-lowest

    name: P${{ matrix.php }} - bacon-qr-code ${{ matrix.bacon }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        # Pinned to an exact release: floating tags make it impossible to tell
        # which version a run used (see GHSA-5wxr-w449-57cm).
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, iconv, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require --no-update "bacon/bacon-qr-code:${{ matrix.bacon }}"
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest
